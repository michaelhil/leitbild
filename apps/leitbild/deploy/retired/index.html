<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Leitbild has moved</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10120f;
        color: #f1f3ec;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 20% 10%, rgba(166, 202, 120, 0.12), transparent 34rem),
          #10120f;
      }

      main {
        width: min(100%, 38rem);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #34392f;
        border-radius: 1.5rem;
        background: rgba(24, 27, 22, 0.92);
        box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.28);
      }

      p { color: #b9c0b0; line-height: 1.65; }
      h1 { margin: 0 0 1rem; font-size: clamp(2rem, 8vw, 4rem); letter-spacing: -0.05em; }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.85rem 1.15rem;
        border-radius: 0.7rem;
        background: #b7e17d;
        color: #182011;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover, a:focus-visible { background: #caef99; }
    </style>
  </head>
  <body>
    <main>
      <h1>Leitbild has moved.</h1>
      <p>Samsinn and the former Leitbild site are now part of one unified workspace platform.</p>
      <a href="https://leitbild.app/">Continue to leitbild.app</a>
    </main>
  </body>
</html>
