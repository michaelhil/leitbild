[package]
name = "leitbild-ld01-host-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "TEST-ONLY S5 risk spike: one LD-01 S1 unit behind a framed stdin/stdout protocol and a minimal C ABI. Never registered in a Pack, the Runtime Hub or the deployer."

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ld01-host-spike"
path = "src/bin/ld01-host-spike.rs"

[features]
# Stock IDAS of the same release (the S2 gate's declared build); the joined
# host's trajectories are bit-identical on IDA (S2-15 Step A).
quadratures = ["ida", "leitbild-operating-water/quadratures"]
# The included harness modules compile under `ida` (water-ffi is always
# linked with its `ida` feature here).
ida = []
# The S5 joined host composes through integ's S2 gate harness
# (claude/ld01-s5-host); on the S3 kernel the harness's API moved on and
# `ld01-c5-host` (the S3 composition) supersedes it, so it builds only
# when asked for.
s2-joined-host = []

[[bin]]
name = "ld01-joined-host"
path = "src/bin/ld01-joined-host.rs"
required-features = ["s2-joined-host"]

[dependencies]
leitbild-operating-plant = { path = ".." }
leitbild-operating-water = { path = "../water-ffi", features = ["ida"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
# The operating crate forbids unsafe code. This spike denies it too and
# allows it only in the two narrow modules that need a C ABI: the CPU clock
# and the bun:ffi comparison surface.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
